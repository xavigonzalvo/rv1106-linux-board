<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI Detect</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>AI Detect <span class="sub">YOLOv5 on the RV1106 NPU</span></h1>
  <div id="status-pill" class="pill" title="Detector state"><span class="dot"></span><span id="pill-text">connecting…</span></div>
</header>

<main>
  <section id="input" class="card">
    <div id="drop" tabindex="0" role="button" aria-label="Choose an image">
      <p class="big">Drop an image here</p>
      <p class="muted">or</p>
      <div class="buttons">
        <label class="btn primary">Choose file
          <input id="file" type="file" accept="image/jpeg,image/png,image/*" hidden>
        </label>
        <label class="btn" id="camera-btn">Take photo
          <input id="camera" type="file" accept="image/*" capture="environment" hidden>
        </label>
      </div>
    </div>
    <div class="options">
      <label><input type="checkbox" id="downscale" checked> Downscale to 1280 px before upload</label>
      <label>Min score <input type="range" id="minscore" min="0" max="0.9" step="0.05" value="0.25"> <output id="minscore-out">0.25</output></label>
    </div>
  </section>

  <section id="result" class="card" hidden>
    <div id="busy" class="busy" hidden><span class="spinner"></span> <span id="busy-text">Detecting…</span></div>
    <div id="error" class="error" hidden></div>
    <div class="stage"><canvas id="canvas" aria-label="Image with detected objects"></canvas></div>
    <div class="grid">
      <div>
        <h2>Detections <span id="count" class="muted"></span></h2>
        <ul id="objects" class="objects"></ul>
      </div>
      <div>
        <h2>Timing</h2>
        <table id="timing" class="timing"></table>
      </div>
    </div>
  </section>

  <section id="status" class="card">
    <h2>Board</h2>
    <dl class="stats">
      <div><dt>Detector</dt><dd id="s-state">–</dd></div>
      <div><dt>Model</dt><dd id="s-model">–</dd></div>
      <div><dt>SoC temp</dt><dd id="s-temp">–</dd></div>
      <div><dt>Memory free</dt><dd id="s-mem">–</dd></div>
      <div><dt>Load</dt><dd id="s-load">–</dd></div>
      <div><dt>Uptime</dt><dd id="s-uptime">–</dd></div>
      <div><dt>Images served</dt><dd id="s-served">–</dd></div>
      <div><dt>Last inference</dt><dd id="s-last">–</dd></div>
    </dl>
    <p id="s-error" class="muted small" hidden></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
